<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Quản trị — PT Plugins</title>
<script>
  (function(){ var t; try{ t=localStorage.getItem("pt-theme") }catch(e){}
    if(!t) t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
    document.documentElement.dataset.theme=t; })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;--ease:cubic-bezier(.2,.7,.2,1);--r:8px}
[data-theme="light"]{--bg:#f3f0e9;--surface:#fbfaf6;--surface-2:#efebe2;--ink:#1b1a17;--ink-2:#3a3833;--muted:#777166;--line:#d9d2c4;--line-2:#b9b09e;--accent:#a4472a;--accent-2:#c56a48;--on-accent:#fff;--ok:#2a8a5c;--warn:#b7791f;--err:#c23b3b;--shadow:0 12px 32px -18px rgba(27,26,23,.3)}
[data-theme="dark"]{--bg:#111315;--surface:#181b1e;--surface-2:#1f2326;--ink:#ebe6db;--ink-2:#c9c3b7;--muted:#8f8a80;--line:#2b2f33;--line-2:#41464c;--accent:#d77a52;--accent-2:#e89670;--on-accent:#1b120d;--ok:#4cbf86;--warn:#e0a23a;--err:#e06060;--shadow:0 16px 36px -20px rgba(0,0,0,.7)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:16px;height:16px;flex:none}

/* top bar */
.top{position:sticky;top:0;z-index:20;height:58px;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;text-decoration:none;color:var(--ink)}
.brand svg{width:24px;height:24px;color:var(--accent)}
.brand .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;padding:3px 7px;border-radius:4px;background:var(--accent);color:var(--on-accent)}
.top .sp{flex:1}
.ib{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);background:none;display:grid;place-items:center;cursor:pointer;transition:border-color .2s}
.ib:hover{border-color:var(--accent)}
.who{display:flex;align-items:center;gap:10px;font-size:13px}
.who img,.who .av{width:32px;height:32px;border-radius:50%;border:2px solid var(--accent);object-fit:cover;display:grid;place-items:center;background:var(--surface-2);font-weight:600}
.who small{display:block;color:var(--muted);font-size:11.5px}
.link{color:var(--ink-2);text-decoration:none;font-size:13.5px}
.link:hover{color:var(--accent)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:500;font-size:13.5px;transition:background .2s,border-color .2s,transform .12s;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.dan{color:var(--err);border-color:color-mix(in srgb,var(--err) 50%,transparent)}
.btn.dan.armed{background:var(--err);color:#fff;border-color:var(--err)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn[disabled]{opacity:.5;pointer-events:none}

/* layout */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 58px)}
.side{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r);border:0;background:none;cursor:pointer;text-align:left;color:var(--ink-2);font-weight:500;transition:background .2s,color .2s}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav[aria-current="true"]{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.nav .badge[hidden]{display:none}
.nav .badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:600;display:grid;place-items:center}
.side .foot{margin-top:auto;padding:12px;font-size:12px;color:var(--muted)}
.main{padding:26px 28px 60px;min-width:0}
.view{animation:vin .35s var(--ease)}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.chip{border:1px solid var(--line-2);background:none;padding:6px 12px;border-radius:999px;cursor:pointer;font-size:12.5px;transition:.2s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:1;min-width:180px;max-width:320px;padding:8px 12px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface)}

/* feedback */
.fb{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:16px;align-items:start}
.list{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 220px);overflow:auto;padding-right:4px}
.item{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;cursor:pointer;transition:border-color .2s,transform .2s;position:relative;text-align:left;width:100%}
.item:hover{border-color:var(--line-2);transform:translateX(2px)}
.item[aria-current="true"]{border-color:var(--accent)}
.item.new::before{content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.item .r1{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.item .msg{margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px}
.item.new .msg{font-weight:500}
.tg{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:4px}
.tg.bug{background:color-mix(in srgb,var(--err) 16%,transparent);color:var(--err)}
.tg.feature{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.st{font-size:11px;margin-left:auto}
.st.new{color:var(--accent)} .st.seen{color:var(--warn)} .st.done{color:var(--ok)}
.detail{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:22px;box-shadow:var(--shadow);min-height:300px}
.detail h2{font-size:18px;margin:6px 0 2px;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:12.5px;margin-bottom:16px}
.body{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:14px;font-size:14px}
.imgs{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.imgs img{width:150px;height:100px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;transition:transform .2s}
.imgs img:hover{transform:scale(1.04)}
details{margin-top:14px;border:1px solid var(--line);border-radius:var(--r)}
summary{padding:10px 14px;cursor:pointer;font-size:13px;color:var(--ink-2)}
details pre{margin:0;padding:12px 14px;border-top:1px solid var(--line);max-height:320px;overflow:auto;font:12px/1.5 var(--mono);white-space:pre-wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.empty{color:var(--muted);text-align:center;padding:50px 20px;border:1px dashed var(--line-2);border-radius:12px}

/* plugins */
.tbl{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.row{display:grid;grid-template-columns:44px 1.6fr .8fr .9fr 120px auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);transition:background .2s}
.row:first-child{border-top:0}
.row.head{background:var(--surface-2);font-size:11px;color:var(--muted);font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase}
.row:not(.head):hover{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
.row.off{opacity:.55}
.pic{width:40px;height:40px;border-radius:10px;border:1px solid #2a2d31;background:#141517;color:#EEEAE3;display:grid;place-items:center;overflow:hidden;font-weight:600;font-size:13px}
.pic img{width:26px;height:26px;object-fit:contain}
.row b{display:block;font-weight:600}
.row small{color:var(--muted);font-family:var(--mono);font-size:11.5px}
.row div small{display:block}
.sw{position:relative;width:40px;height:22px;border-radius:11px;background:var(--line-2);border:0;cursor:pointer;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .25s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.swl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}

/* forms / modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,8,10,.6);backdrop-filter:blur(5px);display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s}
.ov.open{opacity:1;pointer-events:auto}
.modal{width:min(620px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:14px;padding:26px;transform:translateY(16px) scale(.98);transition:transform .35s var(--ease);position:relative}
.ov.open .modal{transform:none}
.modal h3{margin:0 0 4px;font-size:20px}
.x{position:absolute;right:12px;top:10px;width:32px;height:32px;border:0;background:none;border-radius:50%;cursor:pointer;font-size:20px;color:var(--muted)}
.x:hover{background:var(--surface-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.f label{font-size:12.5px;color:var(--muted);font-weight:500}
.f input,.f select,.f textarea{padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--bg);transition:border-color .2s,box-shadow .2s}
.f input:focus,.f select:focus,.f textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.f textarea{min-height:110px;resize:vertical;font-family:var(--mono);font-size:12.5px}
.drop{border:2px dashed var(--line-2);border-radius:12px;padding:26px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;margin-bottom:16px}
.drop:hover,.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
.drop b{display:block;font-size:15px;margin-bottom:4px}
.drop small{color:var(--muted)}
.fileinfo{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);margin-bottom:16px;font-size:13px}
.fileinfo .mono{color:var(--muted);text-transform:none;letter-spacing:0;font-size:11.5px;word-break:break-all}
.steps{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px}
.steps li{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--muted)}
.steps li.run{color:var(--ink)} .steps li.ok{color:var(--ok)} .steps li.err{color:var(--err)}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;flex:none;display:grid;place-items:center}
.steps li.run .dot{border-right-color:transparent;animation:spin .7s linear infinite}
.steps li.ok .dot{background:currentColor}
@keyframes spin{to{transform:rotate(360deg)}}
.msgbox{padding:10px 14px;border-radius:var(--r);font-size:13px;margin-top:12px}
.msgbox.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.msgbox.err{background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err)}
.msgbox.info{background:var(--surface-2);color:var(--ink-2)}
.card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:22px;max-width:640px}
.card ol{padding-left:20px;margin:8px 0 16px}
.card li{margin:4px 0}
.gate{min-height:calc(100vh - 58px);display:grid;place-items:center;padding:20px}
.gate .card{text-align:center;max-width:400px;width:100%}
.gate .card .btn{width:100%;margin-top:10px}
.lb{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:30px;cursor:zoom-out;opacity:0;pointer-events:none;transition:opacity .25s}
.lb.open{opacity:1;pointer-events:auto}
.lb img{max-width:100%;max-height:100%;border-radius:6px}
.toast{position:fixed;left:50%;bottom:24px;translate:-50% 20px;opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:13.5px;transition:.25s;pointer-events:none;z-index:80}
.toast.show{opacity:1;translate:-50% 0}
.spin{width:22px;height:22px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;margin:40px auto}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);overflow:auto;padding:10px}
  .side .foot{display:none}
  .fb{grid-template-columns:1fr}
  .list{max-height:none}
  .row{grid-template-columns:40px 1fr auto;}
  .row > :nth-child(3),.row > :nth-child(4){display:none}
  .row.head{display:none}
  .main{padding:18px}
  .who span{display:none}
  .grid2{grid-template-columns:1fr}
}
/* plugin: nút, ảnh đại diện */
.pacts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.row:not(.head){grid-template-columns:44px 1.5fr .7fr .8fr 120px minmax(250px,auto)}
.row.head{grid-template-columns:44px 1.5fr .7fr .8fr 120px minmax(250px,auto)}
.icopick{display:flex;gap:14px;align-items:center;padding:12px;border:1px dashed var(--line-2);border-radius:12px;cursor:pointer;transition:border-color .2s,background .2s;margin-bottom:12px}
.icopick:hover,.icopick.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
.icopick .pic{width:56px;height:56px;border-radius:14px}
.icopick .pic img{width:38px;height:38px}
.icopick small{display:block;color:var(--muted);font-size:12px}
.warnbox{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
/* tài khoản bản quyền */
.srch{position:relative;flex:1;min-width:220px;max-width:420px}
.srch svg{position:absolute;left:11px;top:50%;translate:0 -50%;color:var(--muted)}
.srch input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);transition:border-color .2s,box-shadow .2s}
.srch input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.grp{margin:22px 0 10px;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.grp b{font-family:var(--sans);font-size:12px;letter-spacing:0;text-transform:none;padding:1px 8px;border-radius:10px;background:var(--surface-2);color:var(--ink-2)}
.grp .dotc{width:8px;height:8px;border-radius:50%}
.acc{border:1px solid var(--line);background:var(--surface);border-radius:12px;margin-bottom:8px;overflow:hidden;transition:border-color .25s,box-shadow .25s;animation:vin .35s var(--ease) both}
.acc:hover{border-color:var(--line-2)}
.acc.open{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:var(--shadow)}
.acc>button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:36px 1fr auto auto 18px;gap:14px;align-items:center;padding:12px 16px;cursor:pointer}
.acc>button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.av2{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;background:var(--surface-2);color:var(--ink-2)}
.acc.on .av2{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.acc .em{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc .em small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:11.5px;padding:2px 9px;border-radius:10px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{border-color:color-mix(in srgb,var(--ok) 50%,transparent);color:var(--ok)}
.pill.w{border-color:color-mix(in srgb,var(--warn) 50%,transparent);color:var(--warn)}
.pill.e{border-color:color-mix(in srgb,var(--err) 50%,transparent);color:var(--err)}
.acc .amt{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:90px;text-align:right}
.acc .chev{color:var(--muted);transition:transform .3s var(--ease)}
.acc.open .chev{transform:rotate(90deg);color:var(--accent)}
.accb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}
.acc.open .accb{grid-template-rows:1fr}
.accb>div{overflow:hidden}
.accin{padding:4px 16px 16px;border-top:1px solid var(--line);display:grid;gap:12px}
.lic{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg)}
.lic.rv{opacity:.6}
.lic h4{margin:0;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lic h4 small{font-weight:400;color:var(--muted);font-size:12px}
.lic .sp{flex:1}
.devs{display:grid;gap:6px;margin-top:10px}
.dev{display:grid;grid-template-columns:18px 1fr auto auto;gap:10px;align-items:center;font-size:13px;padding:7px 10px;border-radius:8px;background:var(--surface)}
.dev small{color:var(--muted);font-family:var(--mono);font-size:11px}
.ords{display:grid;gap:4px}
.ord{display:grid;grid-template-columns:100px 1fr 100px 130px auto;gap:10px;align-items:center;font-size:13px;padding:7px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.ord code{font-family:var(--mono);font-size:12px}
.sec{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
mark{background:color-mix(in srgb,var(--accent) 30%,transparent);color:inherit;border-radius:3px;padding:0 1px}
@media (max-width:900px){.acc>button{grid-template-columns:36px 1fr 18px}.acc .pills,.acc .amt{display:none}.ord{grid-template-columns:1fr 1fr}.row:not(.head){grid-template-columns:40px 1fr}.pacts{grid-column:1/-1;justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-msg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12Z"/></symbol>
  <symbol id="i-lic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M7 6V4h10v2M8 11h8M8 15h5"/></symbol>

/* =========================================================
   GITHUB API (token lưu trong trình duyệt của quản trị viên)
   ========================================================= */
const token = () => ls.get("pt-gh-token");
async function gh(path, opt = {}) {
  const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}${path}`, {
    ...opt, headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${token()}`, "X-GitHub-Api-Version": "2022-11-28", ...(opt.body ? { "Content-Type": "application/json" } : {}), ...(opt.headers || {}) }
  });
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).message } catch (e) {} throw new Error(`GitHub ${r.status}: ${m}`); }
  return r.status === 204 ? null : r.json();
}
async function readJson(path) {
  const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=main&t=${Date.now()}`, { headers: { Accept: "application/vnd.github.raw+json", ...(token() ? { Authorization: `Bearer ${token()}` } : {}) } });
  if (!r.ok) throw new Error(`Không đọc được ${path} (${r.status})`);
  return JSON.parse(await r.text());
}
async function readText(path) {
  const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=main&t=${Date.now()}`, { headers: { Accept: "application/vnd.github.raw+json", ...(token() ? { Authorization: `Bearer ${token()}` } : {}) } });
  if (!r.ok) throw new Error(`Không đọc được ${path} (${r.status})`);
  return r.text();
}
async function allReleases() {
  const out = []; for (let pg = 1; pg < 10; pg++) { const a = await gh(`/releases?per_page=100&page=${pg}`); out.push(...a); if (a.length < 100) break; } return out;
}
const cmpVer = (a, b) => { const pa = String(a).split(".").map(Number), pb = String(b).split(".").map(Number); for (let i = 0; i < Math.max(pa.length, pb.length); i++) { const d = (pa[i] || 0) - (pb[i] || 0); if (d) return d; } return 0; };
const b64 = buf => { let s = "", a = new Uint8Array(buf); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
const jsonText = o => JSON.stringify(o, null, 2) + "\n";

// Một commit gồm nhiều tệp: [{path, base64}|{path, text}]
async function commitFiles(files, message, onStep = () => {}) {
  onStep("ref"); const ref = await gh("/git/ref/heads/main");
  const head = ref.object.sha; const base = await gh(`/git/commits/${head}`);
  const tree = [];
  for (const f of files) {
    if (f.delete) { tree.push({ path: f.path, mode: "100644", type: "blob", sha: null }); continue; }
    if (f.base64 != null) { onStep("blob", f.path); const b = await gh("/git/blobs", { method: "POST", body: JSON.stringify({ content: f.base64, encoding: "base64" }) }); tree.push({ path: f.path, mode: "100644", type: "blob", sha: b.sha }); }
    else tree.push({ path: f.path, mode: "100644", type: "blob", content: f.text });
  }
  onStep("commit");
  const t = await gh("/git/trees", { method: "POST", body: JSON.stringify({ base_tree: base.tree.sha, tree }) });
  const c = await gh("/git/commits", { method: "POST", body: JSON.stringify({ message, tree: t.sha, parents: [head] }) });
  onStep("push"); await gh("/git/refs/heads/main", { method: "PATCH", body: JSON.stringify({ sha: c.sha }) });
  return c;
}

async function checkGitHub() {
  try {
    const r = await gh("");
    if (!r.permissions?.push) throw new Error("Token không có quyền ghi (Contents: Read and write) vào kho này.");
    const u = await fetch("https://api.github.com/user", { headers: { Authorization: `Bearer ${token()}` } }).then(r => r.ok ? r.json() : {}).catch(() => ({}));
    S.gh = { ok: true, login: u.login || "?" };
  } catch (e) { S.gh = { ok: false, err: e.message }; }
  return S.gh;
}

/* ---------- Ảnh đại diện ---------- */
const ICON_EXT = { "image/svg+xml": "svg", "image/png": "png", "image/jpeg": "jpg", "image/webp": "webp", "image/gif": "gif" };
function iconPicker(el, current) {
  const st = { file: null, buf: null, ext: "" };
  el.innerHTML = `<label class="icopick" id="icp"><input type="file" accept=".svg,.png,.jpg,.jpeg,.webp,.gif,image/*" hidden>
    <div class="pic">${current ? `<img src="${esc(current)}" alt="">` : `<svg class="i"><use href="#i-img"/></svg>`}</div>
    <div><b>${current ? "Đổi ảnh đại diện" : "Chọn ảnh đại diện"}</b><small>SVG, PNG, JPG, WEBP · tối đa 1 MB · nên là ảnh vuông, nền trong suốt</small><small id="icn"></small></div></label>`;
  const lab = el.querySelector("label"), inp = el.querySelector("input");
  ["dragenter", "dragover"].forEach(ev => lab.addEventListener(ev, e => { e.preventDefault(); lab.classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev => lab.addEventListener(ev, e => { e.preventDefault(); lab.classList.remove("over"); }));
  lab.addEventListener("drop", e => e.dataTransfer.files[0] && take(e.dataTransfer.files[0]));
  inp.onchange = () => inp.files[0] && take(inp.files[0]);
  async function take(f) {
    const ext = ICON_EXT[f.type] || (f.name.match(/\.(svg|png|jpe?g|webp|gif)$/i) || [])[1]?.toLowerCase().replace("jpeg", "jpg");
    if (!ext) return el.querySelector("#icn").textContent = "Định dạng ảnh không hỗ trợ";
    if (f.size > 1048576) return el.querySelector("#icn").textContent = "Ảnh lớn hơn 1 MB – hãy thu nhỏ ảnh";
    st.file = f; st.ext = ext; st.buf = await f.arrayBuffer();
    el.querySelector(".pic").innerHTML = `<img src="${URL.createObjectURL(f)}" alt="">`;
    el.querySelector("#icn").textContent = `${f.name} · ${fmtSize(f.size)}`;
  }
  return st;
}
/* tệp cần ghi khi đổi ảnh: ảnh mới + xoá ảnh cũ cùng mã (khác đuôi) */
function iconFiles(id, ic, oldIcon) {
  if (!ic?.buf) return { files: [], path: null };
  const path = `icons/${id}.${ic.ext}`, files = [{ path, base64: b64(ic.buf) }];
  const old = (oldIcon || "").split("?")[0];
  if (old && old !== path && old.startsWith(`icons/${id}.`)) files.push({ path: old, delete: true });
  return { files, path: `${path}?v=${Date.now().toString(36)}` };
}

function bindInfo() {
  const sw = $("#i_paid"), sync = () => { const on = sw.getAttribute("aria-checked") === "true"; $("#i_paidT").textContent = on ? "Có bản quyền (trả phí)" : "Miễn phí"; $("#i_priceBox").style.display = on ? "" : "none"; };

function readInfo() {
  const paid = $("#i_paid").getAttribute("aria-checked") === "true", price = Math.max(0, Math.round(Number($("#i_price").value) || 0));
  if (paid && price < 1000) throw new Error("Nhập giá bản quyền (từ 1.000đ)");
  const vfile = $("#i_vfile").files[0] || null;
  if (vfile && vfile.size > 24 * 1048576) throw new Error("Video quá lớn (tối đa 24 MB) – hãy dán link YouTube/Drive.");
  return { paid, price, vurl: $("#i_vurl").value.trim(), vfile, features: $("#i_feat").value.split("\n").map(x => x.replace(/^\s*[-•*]\s*/, "").trim()).filter(Boolean) };
}
// Ghi thông tin vào danh mục PT Hub (c) + trang web (s); trả về các tệp cần commit thêm
async function applyInfo(id, c, s, info) {
  const files = [], wasPaid = c.type === "paid" || s.type === "paid";
  c.type = s.type = info.paid ? "paid" : "free"; c.price = s.price = info.paid ? info.price : 0;
  if (info.paid || wasPaid) c.gated = s.gated = true;              // gói có khoá bản quyền → khi miễn phí PT Hub cấp token miễn phí
  const old = s.video || "";
  if (info.vfile) {
    const ext = /webm$/i.test(info.vfile.name) ? "webm" : "mp4", path = `pt-hub/video/${id}.${ext}`;
    files.push({ path, base64: b64(await info.vfile.arrayBuffer()) });
    s.video = path; c.tutorial_url = WEB + path;
  } else if (info.vurl) { if (!/^https:\/\//.test(info.vurl)) throw new Error("Link video phải bắt đầu bằng https://"); s.video = info.vurl; c.tutorial_url = info.vurl; }
  else if (/^https?:/.test(old)) { s.video = ""; c.tutorial_url = ""; }
  s.features = info.features;
  return files;
}

      S.cat.updated = new Date().toISOString().slice(0, 19).replace("T", " ");

      const rels = (await allReleases()).filter(r => (r.tag_name || "").startsWith(id + "-v"));
      step(`Xoá ${rels.length} bản phát hành trên GitHub`);
      for (const r of rels) { await gh(`/releases/${r.id}`, { method: "DELETE" }); try { await gh(`/git/refs/tags/${encodeURIComponent(r.tag_name)}`, { method: "DELETE" }); } catch (e) {} }
      step("Hoàn tất", "ok");

  };
}

/* ---------- Đọc .rbz (ZIP) để tự nhận mã + phiên bản ---------- */
async function inspectRbz(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eocd = -1; for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error("Tệp không phải gói .rbz (ZIP) hợp lệ");
  const n = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true); const ents = [];
  const dec = new TextDecoder();
  for (let k = 0; k < n; k++) {
    const meth = dv.getUint16(p + 10, true), csz = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    ents.push({ name: dec.decode(u8.subarray(p + 46, p + 46 + nl)), meth, csz, off }); p += 46 + nl + xl + cl;
  }
  const loader = ents.find(e => /^[^/]+\.rb$/i.test(e.name));
  if (!loader) throw new Error("Không thấy tệp nạp .rb ở gốc gói");
  const id = loader.name.replace(/\.rb$/i, "");
  const lo = loader.off, ds = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true);
  let data = u8.subarray(ds, ds + loader.csz), text = "";
  if (loader.meth === 8) data = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
  text = dec.decode(data);
  const vm = text.match(/VERSION\s*=\s*['"](\d+(?:\.\d+)+)['"]/);
  const nm = text.match(/SketchupExtension\.new\(\s*['"]([^'"]+)['"]/);
  return { id, version: vm ? vm[1] : "", name: nm ? nm[1] : "", hasFolder: ents.some(e => e.name.startsWith(id + "/")) };
}
async function sha256(buf) { return [...new Uint8Array(await crypto.subtle.digest("SHA-256", buf))].map(b => b.toString(16).padStart(2, "0")).join(""); }

/* tô sáng từ khoá */
const hl = (t, q) => { const s = esc(t); if (!q) return s; const i = String(t).toLowerCase().indexOf(q); return i < 0 ? s : esc(String(t).slice(0, i)) + "<mark>" + esc(String(t).slice(i, i + q.length)) + "</mark>" + esc(String(t).slice(i + q.length)); };
function accounts() {
  const m = new Map(), get = e => { const k = (e || "").toLowerCase(); if (!m.has(k)) m.set(k, { email: e, lic: [], ord: [] }); return m.get(k); };
  S.lic.licenses.forEach(l => get(l.email).lic.push(l));
  S.lic.orders.forEach(o => get(o.email).ord.push(o));
  return [...m.values()].map(a => {
    const live = a.lic.filter(l => !l.revoked);
    a.devices = live.reduce((n, l) => n + l.devices.length, 0);
    a.active = a.devices > 0;
    a.paid = a.ord.filter(o => o.status === "paid").reduce((s, o) => s + (o.paid_amount || o.amount || 0), 0);
    a.pending = a.ord.filter(o => o.status === "pending").length;
    a.last = Math.max(0, ...a.lic.map(l => l.created || 0), ...a.ord.map(o => o.created || 0), ...a.lic.flatMap(l => l.devices.map(d => d.last_seen || 0)));
    a.hay = [a.email, ...a.lic.flatMap(l => [l.product, l.product_name, l.order_code, l.note, ...l.devices.flatMap(d => [d.name, d.device_id])]), ...a.ord.flatMap(o => [o.code, o.product, o.product_name])].filter(Boolean).join(" ").toLowerCase();
    return a;
  }).sort((x, y) => y.last - x.last);
}
function drawAccounts(box) {
  const q = S.lq.trim().toLowerCase(), all = accounts(), A = q ? all.filter(a => a.hay.includes(q)) : all;

function accRow(a, q, i) {
  const live = a.lic.filter(l => !l.revoked);
  const pills = live.map(l => `<span class="pill ${l.devices.length ? "ok" : ""}">${esc(l.product_name)} · ${l.devices.length}/2</span>`).join("")
    + (a.lic.length > live.length ? `<span class="pill e">${a.lic.length - live.length} thu hồi</span>` : "")
    + (a.pending ? `<span class="pill w">${a.pending} đơn chờ</span>` : "")

  return `<div class="acc ${a.active ? "on" : ""}" data-k="${esc(a.email.toLowerCase())}" style="animation-delay:${Math.min(i, 12) * 25}ms">
    <button aria-expanded="false"><span class="av2">${esc((a.email[0] || "?").toUpperCase())}</span>
      <span class="em">${hl(a.email, q)}<small>${live.length} bản quyền · ${a.devices} máy · hoạt động ${day(a.last)}</small></span>
      <span class="pills">${pills}</span><span class="amt">${a.paid ? money(a.paid) : "–"}</span><svg class="i chev"><use href="#i-chev"/></svg></button>
    <div class="accb"><div><div class="accin">${accBody(a, q)}</div></div></div></div>`;
}
function accBody(a, q) {
  const lic = a.lic.map(l => `<div class="lic ${l.revoked ? "rv" : ""}" data-id="${l.id}">
      <h4>${hl(l.product_name, q)} <small>cấp ${day(l.created)}${l.order_code ? " · đơn " + hl(l.order_code, q) : ""}${l.note ? " · " + hl(l.note, q) : ""}</small><span class="sp"></span>
        ${l.revoked ? `<span class="pill e">Đã thu hồi</span>` : `<span class="pill ${l.devices.length ? "ok" : "w"}">${l.devices.length ? `${l.devices.length}/2 máy` : "Chưa kích hoạt máy nào"}</span>`}
        ${l.devices.length && !l.revoked ? `<button class="btn sm" data-lreset>Reset máy</button>` : ""}
        <button class="btn sm ${l.revoked ? "" : "dan"}" data-revoke="${l.revoked ? 0 : 1}">${l.revoked ? "Khôi phục" : "Thu hồi"}</button></h4>
      ${l.devices.length ? `<div class="devs">${l.devices.map(d => `<div class="dev"><svg class="i"><use href="#i-pc"/></svg>
        <div>${hl(d.name || "Máy tính", q)}<br><small>mã ${hl(d.device_id.slice(0, 12), q)}…</small></div>
        <small>kích hoạt ${day(d.activated)}<br>dùng gần nhất ${day(d.last_seen)}</small>
        <button class="btn sm" data-rmdev="${esc(d.device_id)}" title="Gỡ máy này để khách kích hoạt máy khác">Gỡ máy</button></div>`).join("")}</div>` : ""}
    </div>`).join("");
  const ord = a.ord.length ? `<div class="sec">Đơn hàng</div><div class="ords">${a.ord.map(o => `<div class="ord"><code>${hl(o.code, q)}</code><span>${hl(o.product_name || o.product, q)}<br><small class="sub">${day(o.created)}</small></span>
      <span>${money(o.amount)}${o.paid_amount && o.paid_amount !== o.amount ? `<br><small class="sub">nhận ${money(o.paid_amount)}</small>` : ""}</span>
      <span class="st ${o.status === "paid" ? "done" : o.status === "pending" ? "new" : ""}" style="margin:0">● ${OST[o.status] || o.status}</span>
      <span>${o.status !== "paid" ? `<button class="btn sm" data-paid="${esc(o.code)}">Xác nhận đã nhận tiền</button>` : `<small class="sub">${day(o.paid_at)}</small>`}</span></div>`).join("")}</div>` : "";
  return (lic ? `<div class="sec">Bản quyền</div>${lic}` : "") + ord
    + `<div class="bar" style="margin:4px 0 0"><button class="btn sm" data-grant="${esc(a.email)}"><svg class="i"><use href="#i-plus"/></svg>Cấp thêm plugin</button><button class="btn sm" data-copy="${esc(a.email)}">Sao chép email</button></div>`;
}
async function accClick(e) {
  const acc = e.target.closest(".acc"); if (!acc) return;
  const b = e.target.closest("button");
  if (b && b.parentElement === acc) { // bấm vào hàng tài khoản → sổ ra / thu lại
    const k = acc.dataset.k, open = !acc.classList.contains("open");
    acc.classList.toggle("open", open); b.setAttribute("aria-expanded", open); open ? S.lopen.add(k) : S.lopen.delete(k); return;
  }
  if (!b) return;
  if (b.dataset.copy) { navigator.clipboard?.writeText(b.dataset.copy); toast("Đã sao chép email"); return; }
  if (b.dataset.grant) { S.lv = "grant"; S.grantEmail = b.dataset.grant; viewLicenses(); return; }
  if (b.dataset.paid) {
    if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Bấm lần nữa để cấp bản quyền"; return; }
    b.disabled = true;
    try { await licApi(fb, "/api/admin/mark-paid", { method: "POST", body: { code: b.dataset.paid } }); toast("Đã xác nhận & cấp bản quyền"); loadLic(); }
    catch (er) { toast(er.message); b.disabled = false; } return;
  }
  const lic = e.target.closest(".lic"); if (!lic) return;
  const id = +lic.dataset.id;
  if (b.classList.contains("dan") && !b.classList.contains("armed")) { const t0 = b.textContent; b.classList.add("armed"); b.textContent = "Bấm lần nữa"; setTimeout(() => { b.classList.remove("armed"); b.textContent = t0; }, 4000); return; }
  b.disabled = true;
  try {
    if (b.dataset.rmdev) await licApi(fb, "/api/admin/remove-device", { method: "POST", body: { license_id: id, device_id: b.dataset.rmdev } });
    else if (b.hasAttribute("data-lreset")) await licApi(fb, "/api/admin/reset", { method: "POST", body: { license_id: id } });
    else if (b.dataset.revoke) await licApi(fb, "/api/admin/revoke", { method: "POST", body: { license_id: id, revoked: b.dataset.revoke === "1" } });
    toast("Đã cập nhật"); loadLic();
  } catch (er) { toast(er.message); b.disabled = false; }
}
function drawOrders(box) {
  const q = S.lq.trim().toLowerCase(), O = S.lic.orders.filter(o => !q || [o.code, o.email, o.product, o.product_name, OST[o.status]].join(" ").toLowerCase().includes(q));
  if (!O.length) { box.innerHTML = `<div class="empty">${q ? `Không có đơn nào khớp “${esc(S.lq)}”.` : "Chưa có đơn hàng."}</div>`; return; }
  box.innerHTML = `<div class="tbl"><div class="row head" style="grid-template-columns:110px 1.4fr 1fr 110px 140px auto"><span>Mã</span><span>Email</span><span>Plugin</span><span>Số tiền</span><span>Trạng thái</span><span></span></div>
    ${O.map(o => `<div class="row" style="grid-template-columns:110px 1.4fr 1fr 110px 140px auto">
      <b class="mono" style="font-family:var(--mono)">${hl(o.code, q)}</b><div>${hl(o.email, q)}<small>${day(o.created)}</small></div><div>${esc(o.product_name || o.product)}</div>
      <div>${money(o.amount)}${o.paid_amount && o.paid_amount !== o.amount ? `<small>nhận ${money(o.paid_amount)}</small>` : ""}</div>
      <div><span class="st ${o.status === "paid" ? "done" : o.status === "pending" ? "new" : ""}">● ${OST[o.status] || o.status}</span>${o.note ? `<small>${esc(o.note)}</small>` : ""}</div>
      <div>${o.status !== "paid" ? `<button class="btn sm" data-paid="${esc(o.code)}" title="Đã nhận tiền nhưng hệ thống chưa tự xác nhận">Xác nhận đã nhận tiền</button>` : `<small>${day(o.paid_at)}</small>`}</div>
    </div>`).join("")}</div>`;
  box.onclick = async e => {
    const b = e.target.closest("[data-paid]"); if (!b) return;
    if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Bấm lần nữa để cấp bản quyền"; return; }
    b.disabled = true;
    try { await licApi(fb, "/api/admin/mark-paid", { method: "POST", body: { code: b.dataset.paid } }); toast("Đã xác nhận & cấp bản quyền"); loadLic(); }
    catch (er) { toast(er.message); b.disabled = false; }
  };
}
function grantForm(box) {
  const P = { mai_viet: "PT SmartRoof", smart_floor: "PT Smartfloor", pt_wallpanel: "PT Wall Panel", pt_smartlight: "PT Smart Light", pt_cabinet: "PT Cabinet" };
  box.innerHTML = `<div class="card"><h3 style="margin-top:0">Cấp bản quyền tay</h3><p class="sub">Dùng khi tặng, đổi tài khoản cho khách, hoặc khách chuyển khoản sai nội dung.</p>
    <div class="grid2"><div class="f"><label>Email Google của khách</label><input id="gEmail" type="email" placeholder="khach@gmail.com" value="${esc(S.grantEmail || "")}"></div>
    <div class="f"><label>Plugin</label><select id="gProd">${Object.entries(P).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></div></div>
    <div class="f"><label>Ghi chú</label><input id="gNote" placeholder="vd. Tặng / chuyển khoản sai nội dung ngày …"></div>
    <button class="btn pri" id="gGo">Cấp bản quyền</button><div id="gMsg"></div></div>`;
  $("#gGo").onclick = async () => {
    $("#gGo").disabled = true;
    try { await licApi(fb, "/api/admin/grant", { method: "POST", body: { email: $("#gEmail").value, product: $("#gProd").value, note: $("#gNote").value } });
      $("#gMsg").innerHTML = `<div class="msgbox ok">Đã cấp ${esc(P[$("#gProd").value])} cho ${esc($("#gEmail").value)}.</div>`; }
    catch (e) { $("#gMsg").innerHTML = `<div class="msgbox err">${esc(e.message)}</div>`; }
    $("#gGo").disabled = false;
  };
}

if (token()) checkGitHub();
