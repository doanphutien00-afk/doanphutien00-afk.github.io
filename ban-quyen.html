<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bản quyền của tôi — PT Plugins</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style id="tkcss"></style>
<style>
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.top .sp{flex:1}
.me{display:flex;align-items:center;gap:10px}
.me small{display:block;color:var(--muted);font-size:12px}
.lic{display:grid;grid-template-columns:auto 1fr;gap:16px;margin-bottom:14px}
.lic .ic{width:56px;height:56px;border-radius:14px;background:#141517;border:1px solid #2a2d31;display:grid;place-items:center}
.lic .ic img{width:34px;height:34px}
.lic h3{margin:0;font-size:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lic .sub{font-size:13px;color:var(--muted);margin:2px 0 12px}
.devs{display:grid;gap:8px}
.dev{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:var(--surface-2);transition:opacity .3s,transform .3s}
.dev.gone{opacity:0;transform:translateX(20px)}
.dev svg{width:20px;height:20px;color:var(--accent);flex:none}
.dev b{display:block;font-size:14px}
.dev small{color:var(--muted);font-size:12px}
.dev .tk-btn{margin-left:auto}
.slot{border:1px dashed var(--line-2);color:var(--muted);background:none;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.empty{text-align:center;padding:40px 20px}
.orders{margin-top:28px}
.orders h2{font-size:18px;margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.armed{background:var(--err)!important;border-color:var(--err)!important;color:#fff!important}
.zalo{display:flex;align-items:center;gap:14px;margin-top:18px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-decoration:none;transition:transform .25s var(--ease),border-color .25s,box-shadow .25s}
.zalo:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 10px 26px -16px rgba(0,0,0,.5)}
.zalo img{width:42px;height:42px;border-radius:10px}
.zalo b{display:block}.zalo small{color:var(--muted)}
.guide{margin-top:28px}.guide h2{font-size:18px;margin:0 0 10px}
.gd{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--surface);overflow:hidden}
.gd summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:10px;transition:background .2s}
.gd summary::-webkit-details-marker{display:none}
.gd summary::after{content:"+";margin-left:auto;color:var(--accent);font-size:20px;line-height:1;transition:transform .3s var(--ease)}
.gd[open] summary::after{transform:rotate(45deg)}
.gd summary:hover{background:var(--surface-2)}
.gd .gb{padding:0 16px 14px;color:var(--ink-2);font-size:14px;animation:rise .3s var(--ease)}
.gd ol{margin:6px 0 0;padding-left:20px}.gd li{margin:5px 0}
.gd code{background:var(--surface-2);padding:1px 6px;border-radius:5px;font-size:12.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;animation:rise .25s var(--ease)}
</style>
</head>
<body>
<nav class="nav"><div class="in"><a class="brand" href="/"><img src="/icons/pt_hub.svg" alt="">PT Plugins</a><span class="sp"></span><a href="/">Plugin</a><a href="/mua.html">Mua bản quyền</a></div></nav>
<main class="wrap">
  <div class="top"><div><h1>Bản quyền của tôi</h1><p class="lead" style="margin:0">Máy đã kích hoạt, chuyển bản quyền sang máy khác, reset thiết bị.</p></div><span class="sp"></span><div id="me"></div></div>
  <div id="root"><div class="spinner"></div></div>
</main>
<script type="module">
import { initFb, loginBox, avatar, esc, errMsg, CSS } from "/tk.js";
import { api, money } from "/lic.js";
document.getElementById("tkcss").textContent = CSS;
const $ = s => document.querySelector(s), root = $("#root");
const toast = t => { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3000); };
const day = t => t ? new Date(t * 1000).toLocaleDateString("vi-VN") : "–";
const PC = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>`;
const ST = { pending: "Chờ thanh toán", paid: "Đã thanh toán", expired: "Hết hạn", cancelled: "Đã huỷ" };
let fb, user, data = null, icons = {};

const man = await fetch("/plugins.json", { cache: "no-store" }).then(r => r.json());
man.plugins.forEach(p => icons[p.id] = p.icon);

const GUIDE = `<div class="guide"><h2>Cách cài đặt</h2>
  <details class="gd" open><summary>1. Cài PT Hub (làm 1 lần)</summary><div class="gb"><ol>
    <li>Tải <b>PT Hub</b> ở trang chủ: <a href="/#install">ptplugin.pages.dev</a> (tệp <code>.rbz</code>).</li>
    <li>Trong SketchUp: <code>Extensions → Extension Manager → Install Extension</code>, chọn tệp .rbz vừa tải.</li>
    <li>Khởi động lại SketchUp, mở <b>PT Hub</b> trong menu Extensions.</li></ol></div></details>
  <details class="gd"><summary>2. Đăng nhập & kích hoạt bản quyền</summary><div class="gb"><ol>
    <li>Trong PT Hub mở tab <b>Tài khoản</b> → đăng nhập đúng tài khoản đã mua.</li>
    <li>Tab <b>Plugin</b> → chọn plugin → <b>Cài đặt</b>, sau đó bấm <b>Kích hoạt</b> (mỗi bản quyền dùng được trên 2 máy).</li>
    <li>Chưa mua? Bấm <b>Dùng thử 3 ngày</b> ngay trong PT Hub, đầy đủ tính năng.</li></ol></div></details>
  <details class="gd"><summary>3. Cập nhật & chuyển sang máy khác</summary><div class="gb"><ol>
    <li>Bản mới sẽ hiện ở tab <b>Cập nhật</b> của PT Hub – bấm 1 lần là xong.</li>
    <li>Đổi máy: ở trang này bấm <b>Huỷ kích hoạt</b> máy cũ (PT Hub trên máy đó tự chuyển về chưa kích hoạt trong vài phút), rồi kích hoạt trên máy mới.</li>
    <li>Máy hỏng / cài lại Windows: dùng <b>Reset thiết bị</b> (30 ngày 1 lần).</li></ol></div></details></div>`;
const ZALO = `<a class="zalo" href="https://zalo.me/g/pgdnbeqnorjlwjgag7zi" target="_blank" rel="noopener"><img src="/icons/zalo.webp" alt="Zalo"><div><b>Tham gia nhóm Zalo khách hàng PT Plugins</b><small>Hỗ trợ, cập nhật tính năng mới, trao đổi cùng người dùng – dành riêng cho tài khoản đã mua bản quyền.</small></div></a>`;

function draw() {
  if (!data.licenses.length) {
    root.innerHTML = `<div class="card empty"><h3 style="margin-top:0">Tài khoản ${esc(user.email)} chưa có bản quyền nào</h3>
      <p class="muted">Nếu đã mua bằng tài khoản Google khác, hãy đăng xuất và đăng nhập đúng tài khoản đó.</p>
      <a class="tk-btn primary" href="/mua.html">Mua bản quyền</a></div>${orders()}${GUIDE}`;
    return;
  }
  root.innerHTML = data.licenses.map(l => {
    const free = data.max_devices - l.devices.length, canReset = Date.now() / 1000 >= l.can_self_reset_at;
    return `<div class="card lic" data-l="${l.product}">
      <div class="ic"><img src="/${esc(icons[l.product] || "icons/pt_hub.svg")}" alt=""></div>
      <div><h3>${esc(l.product_name)} <span class="tag done">Vĩnh viễn</span></h3>
        <div class="sub">Mua ngày ${day(l.created)}${l.order_code ? ` · mã đơn <span class="mono">${esc(l.order_code)}</span>` : ""} · ${l.devices.length}/${data.max_devices} máy</div>
        <div class="devs">${l.devices.map(d => `<div class="dev" data-d="${esc(d.device_id)}">${PC}<div><b>${esc(d.name || "Máy tính")}</b>
            <small>Kích hoạt ${day(d.activated)} · dùng gần nhất ${day(d.last_seen)} · <span class="mono">${esc(d.device_id.slice(0, 8))}</span></small></div>
            <button class="tk-btn sm" data-deact>Huỷ kích hoạt</button></div>`).join("")}
          ${Array.from({ length: free }, () => `<div class="dev slot">${PC}<div>Còn trống – mở PT Hub trên máy mới, đăng nhập ${esc(user.email)} và bấm Kích hoạt</div></div>`).join("")}</div>
        <div class="bar"><button class="tk-btn sm" data-reset ${canReset && l.devices.length ? "" : "disabled"} title="${canReset ? "Xoá toàn bộ máy đã kích hoạt" : "Lần tự reset tiếp theo: " + day(l.can_self_reset_at)}">Reset thiết bị (máy hỏng / cài lại Windows)</button>
          ${!canReset ? `<span class="muted" style="font-size:12.5px;align-self:center">Tự reset lại được từ ${day(l.can_self_reset_at)} – cần gấp hãy liên hệ tác giả.</span>` : ""}</div>
      </div></div>`;
  }).join("") + ZALO + orders() + GUIDE;
}
function orders() {
  const o = data.orders.filter(x => x.status !== "expired" || x.paid_at);
  if (!o.length) return "";
  return `<div class="orders"><h2>Đơn hàng</h2><div class="card" style="padding:6px 12px"><table><tr><th>Mã</th><th>Plugin</th><th>Số tiền</th><th>Ngày</th><th>Trạng thái</th></tr>
    ${o.map(x => `<tr><td class="mono">${esc(x.code)}</td><td>${esc(x.product_name)}</td><td>${money(x.amount)}</td><td>${day(x.created)}</td>
      <td>${x.status === "pending" ? `<a href="/mua.html?p=${x.product}">${ST[x.status]} →</a>` : `<span class="tag ${x.status === "paid" ? "done" : ""}">${ST[x.status] || x.status}</span>`}</td></tr>`).join("")}</table></div></div>`;
}

root.addEventListener("click", async e => {
  const b = e.target.closest("[data-deact],[data-reset]"); if (!b) return;
  if (!b.classList.contains("armed")) { b.classList.add("armed"); b.dataset.t = b.textContent; b.textContent = "Bấm lần nữa để xác nhận"; setTimeout(() => { b.classList.remove("armed"); b.textContent = b.dataset.t; }, 4000); return; }
  const product = b.closest("[data-l]").dataset.l; b.disabled = true;
  try {
    if (b.hasAttribute("data-deact")) {
      const row = b.closest(".dev");
      await api(fb, "/api/license/deactivate", { method: "POST", body: { product, device_id: row.dataset.d } });
      row.classList.add("gone"); toast("Đã huỷ kích hoạt máy. PT Hub trên máy đó sẽ chuyển về chưa kích hoạt trong vài phút.");
    } else {
      await api(fb, "/api/license/self-reset", { method: "POST", body: { product } });
      toast("Đã reset thiết bị. Kích hoạt lại trên máy của bạn trong PT Hub.");
    }
    setTimeout(load, 350);
  } catch (er) { toast(er.message); b.disabled = false; }
});

async function load() {
  try { data = await api(fb, "/api/me"); draw(); }
  catch (e) { root.innerHTML = `<div class="card"><p style="color:var(--err);margin:0">${esc(e.message)}</p></div>`; }
}

try {
  fb = await initFb();
  fb.A.onAuthStateChanged(fb.auth, u => {
    user = u;
    $("#me").innerHTML = u ? `<div class="me">${avatar(u)}<div>${esc(u.displayName || "")}<small>${esc(u.email)}</small></div><button class="tk-btn sm" id="out">Đăng xuất</button></div>` : "";
    $("#out")?.addEventListener("click", () => fb.A.signOut(fb.auth));
    if (!u) { root.innerHTML = `<div class="card"><div id="lg"></div></div>`; loginBox($("#lg"), fb, "Đăng nhập đúng tài khoản Google đã dùng khi mua."); return; }
    root.innerHTML = `<div class="spinner"></div>`; load();
  });
} catch (e) { root.innerHTML = `<div class="card"><p style="color:var(--err)">${esc(errMsg(e))}</p></div>`; }
</script>
</body>
</html>
