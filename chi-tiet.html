<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chi tiết plugin — PT Plugins</title>
<meta name="description" content="SketchUp extensions for architecture & interior design.">
<script>
  // Áp theme/ngôn ngữ trước khi vẽ trang để tránh nháy màn hình
  (function(){
    var t, l;
    try { t = localStorage.getItem("pt-theme"); l = localStorage.getItem("pt-lang"); } catch(e){}
    if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
    document.documentElement.lang = l === "en" ? "en" : "vi";
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --serif:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:4px; --maxw:1200px;
}
[data-theme="light"]{
  --bg:#f3f0e9; --surface:#fbfaf6; --surface-2:#efebe2; --ink:#1b1a17; --ink-2:#3a3833;
  --muted:#777166; --line:#d9d2c4; --line-2:#b9b09e; --accent:#a4472a; --accent-2:#c56a48;
  --on-accent:#fff; --grid-minor:rgba(27,26,23,.045); --grid-major:rgba(27,26,23,.075);
  --shadow:0 1px 0 rgba(27,26,23,.04), 0 12px 32px -18px rgba(27,26,23,.25);
}
[data-theme="dark"]{
  --bg:#111315; --surface:#181b1e; --surface-2:#1f2326; --ink:#ebe6db; --ink-2:#c9c3b7;
  --muted:#8f8a80; --line:#2b2f33; --line-2:#41464c; --accent:#d77a52; --accent-2:#e89670;
  --on-accent:#1b120d; --grid-minor:rgba(235,230,219,.03); --grid-major:rgba(235,230,219,.055);
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 16px 36px -20px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink); font:400 15.5px/1.6 var(--sans);
  -webkit-font-smoothing:antialiased; transition:background .3s,color .3s;
  background-image:
    linear-gradient(var(--grid-major) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),
    linear-gradient(var(--grid-minor) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-minor) 1px,transparent 1px);
  background-size:96px 96px,96px 96px,16px 16px,16px 16px;
  background-attachment:fixed;
}
a{color:inherit}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 28px}
.mono{font-family:var(--mono); font-size:11.5px; letter-spacing:.12em; text-transform:uppercase}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- NAV ---------- */
.nav{position:sticky; top:0; z-index:20; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  background:color-mix(in srgb,var(--bg) 82%,transparent); border-bottom:1px solid var(--line)}
.nav .wrap{display:flex; align-items:center; gap:28px; height:64px}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; font-weight:600; letter-spacing:.01em}
.brand svg{width:26px; height:26px; color:var(--accent)}
.brand small{font-family:var(--mono); font-weight:400; font-size:11px; color:var(--muted); letter-spacing:.1em}
.links{display:flex; gap:22px; margin-left:auto}
.links a{text-decoration:none; font-size:14px; color:var(--ink-2); position:relative}
.links a:hover{color:var(--ink)}
.links a::after{content:""; position:absolute; left:0; right:100%; bottom:-4px; height:1px; background:var(--accent); transition:right .25s}
.links a:hover::after{right:0}
.ctrls{display:flex; gap:8px; align-items:center}
.seg{display:flex; border:1px solid var(--line-2); border-radius:999px; padding:2px}
.seg button{border:0; background:none; padding:4px 10px; border-radius:999px; cursor:pointer; font-family:var(--mono); font-size:11.5px; letter-spacing:.08em; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
.iconbtn{width:34px; height:34px; display:grid; place-items:center; border:1px solid var(--line-2); border-radius:999px; background:none; cursor:pointer}
.iconbtn svg{width:16px; height:16px}
.iconbtn:hover{border-color:var(--ink)}
[data-theme="light"] .i-sun,[data-theme="dark"] .i-moon{display:none}

/* ---------- HERO ---------- */
.hero{padding:72px 0 56px; border-bottom:1px solid var(--line)}
.hero .wrap{display:grid; grid-template-columns:1.15fr .85fr; gap:48px; align-items:center}
.kicker{color:var(--accent); display:flex; align-items:center; gap:12px}
.kicker::before{content:""; width:28px; height:1px; background:currentColor}
h1{font-family:var(--serif); font-weight:600; font-size:clamp(40px,5.6vw,70px); line-height:1.04; letter-spacing:-.04em; margin:18px 0 22px}
h1 em{font-style:normal; color:var(--accent); position:relative; white-space:nowrap}
h1 em::after{content:""; position:absolute; left:0; right:0; bottom:.04em; height:.08em; background:currentColor; transform-origin:left; transform:scaleX(0); animation:underline .9s var(--ease) 1.1s forwards}
@keyframes underline{to{transform:scaleX(1)}}
h1 .line{display:block; overflow:hidden; padding-bottom:.06em}
h1 .line > span{display:inline-block; transform:translateY(105%); animation:rise .9s var(--ease) forwards}
h1 .line:nth-child(2) > span{animation-delay:.12s}
@keyframes rise{to{transform:none}}
.lead{font-size:17.5px; color:var(--ink-2); max-width:540px; margin:0 0 30px; font-weight:300}
.cta{display:flex; gap:12px; flex-wrap:wrap}
.btn{display:inline-flex; align-items:center; gap:9px; padding:12px 20px; border-radius:var(--r); text-decoration:none; font-weight:500; font-size:14.5px; border:1px solid transparent; cursor:pointer; transition:transform .15s, background .2s, border-color .2s}
.btn svg{width:16px; height:16px}
.btn.primary{background:var(--accent); color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2); transform:translateY(-1px)}
.btn.ghost{border-color:var(--line-2); background:transparent}
.btn.ghost:hover{border-color:var(--ink)}
.btn[aria-disabled="true"]{opacity:.45; pointer-events:none}
.drawing{color:var(--ink); width:100%; height:auto}
.drawing .acc{color:var(--accent)}
.drawing text{font-family:var(--mono); font-size:9px; letter-spacing:.08em; fill:var(--muted)}

.dims{display:grid; grid-template-columns:repeat(3,1fr); margin-top:46px; border-top:1px solid var(--line)}
.dim{padding:18px 0 0; position:relative}
.dim + .dim{padding-left:22px; border-left:1px solid var(--line)}
.dim b{display:block; font-family:var(--serif); font-weight:300; font-size:40px; line-height:1; letter-spacing:-.03em; font-variant-numeric:tabular-nums}
.dim span{color:var(--muted)}

/* ---------- SECTIONS ---------- */
section{padding:72px 0}
.sec-head{display:flex; align-items:end; justify-content:space-between; gap:24px; flex-wrap:wrap; margin-bottom:28px}
.sec-no{color:var(--accent)}
h1,h2,h3,.step h4{text-transform:capitalize}
h2{font-family:var(--serif); font-weight:600; font-size:clamp(28px,3.4vw,40px); margin:6px 0 0; letter-spacing:-.035em}
.toolbar{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.search{position:relative}
.search svg{position:absolute; left:12px; top:50%; translate:0 -50%; width:15px; height:15px; color:var(--muted)}
.search input{width:250px; padding:10px 12px 10px 36px; border:1px solid var(--line-2); background:var(--surface); color:var(--ink); border-radius:var(--r); font:inherit; font-size:14px}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{border:1px solid var(--line-2); background:transparent; padding:7px 13px; border-radius:var(--r); cursor:pointer; font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}

.notice{border:1px dashed var(--line-2); color:var(--ink-2); padding:10px 14px; border-radius:var(--r); font-size:14px; margin-bottom:18px; background:var(--surface)}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:20px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow);
  display:flex; flex-direction:column; position:relative; transition:transform .2s, border-color .2s}
.card:hover{transform:translateY(-2px); border-color:var(--line-2)}
/* dấu góc kiểu bản vẽ */
.card::before,.card::after{content:""; position:absolute; width:10px; height:10px; border-color:var(--accent); border-style:solid}
.card::before{top:-1px; left:-1px; border-width:2px 0 0 2px}
.card::after{bottom:-1px; right:-1px; border-width:0 2px 2px 0}
.card-top{display:flex; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--line); color:var(--muted)}
.card-top .tag{color:var(--accent)}
.card-body{padding:20px; display:flex; flex-direction:column; gap:14px; flex:1}
.card-head{display:flex; gap:16px; align-items:center}
.icon{width:56px; height:56px; flex:none; border:1px solid #2a2d31; border-radius:14px; display:grid; place-items:center; background:#141517; color:#EEEAE3; font-family:var(--serif); font-size:18px; font-weight:600; box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.icon img{width:34px; height:34px; object-fit:contain}
h3{font-family:var(--serif); font-weight:600; font-size:20px; line-height:1.2; margin:0; letter-spacing:-.02em}
.new{font-family:var(--mono); font-size:10px; letter-spacing:.1em; background:var(--accent); color:var(--on-accent); padding:2px 6px; border-radius:2px; margin-left:8px; vertical-align:4px}
.desc{margin:0; color:var(--ink-2); font-size:14.5px}
.specs{display:grid; grid-template-columns:repeat(4,1fr); margin:0; border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
.specs div{padding:10px 0}
.specs div + div{padding-left:12px; border-left:1px solid var(--line)}
.specs dt{color:var(--muted); font-size:10px; letter-spacing:.06em; white-space:nowrap}
.specs dd{margin:2px 0 0; font-size:13.5px; font-weight:500; white-space:nowrap}
.price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px dashed color-mix(in srgb,var(--accent) 55%,transparent);border-radius:var(--r);text-decoration:none;color:var(--ink);background:color-mix(in srgb,var(--accent) 6%,transparent);transition:background .25s,border-color .25s,transform .25s var(--ease)}
.price b{font-size:19px;color:var(--accent);letter-spacing:-.02em}
.price span{font-size:12.5px;color:var(--muted)}
.price em{margin-left:auto;font-style:normal;font-size:13px;font-weight:600;color:var(--accent);transition:transform .25s var(--ease)}
.price:hover{background:color-mix(in srgb,var(--accent) 12%,transparent);border-style:solid}
.price:hover em{transform:translateX(3px)}
.actions{display:flex; gap:10px; margin-top:auto}
.actions .btn{flex:1; justify-content:center; padding:11px 14px}
.log{border-top:1px dashed var(--line-2); padding-top:6px}
.hubhint{margin-top:12px;padding:12px 14px;border:1px solid var(--accent);border-radius:var(--r);background:color-mix(in srgb,var(--accent) 8%,transparent);animation:hh .35s var(--ease) both}
.hubhint p{margin:0 0 10px;font-size:14px;color:var(--ink-2)}
.hh-act{display:flex;gap:8px}.hh-act .btn{flex:1;justify-content:center;padding:8px 12px}
@keyframes hh{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.rel{padding:12px 0; border-bottom:1px solid var(--line)}
.rel:last-child{border-bottom:0}
.rel-top{display:flex; justify-content:space-between; gap:10px; font-size:12px}
.rel-top a{color:var(--accent); text-decoration:none}
.notes{font-size:13.5px; color:var(--ink-2); margin-top:4px}
.notes ul{margin:4px 0; padding-left:18px}
.notes h4{margin:8px 0 2px; font-size:13px}
.empty{grid-column:1/-1; text-align:center; color:var(--muted); padding:56px; border:1px dashed var(--line-2); border-radius:var(--r)}
.skeleton{height:330px; background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%); background-size:200% 100%; animation:sk 1.4s infinite; border:1px solid var(--line); border-radius:var(--r)}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- INSTALL ---------- */
.steps{display:grid; grid-template-columns:repeat(3,1fr); border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
.step{padding:28px 26px}
.step + .step{border-left:1px solid var(--line)}
.step .n{font-family:var(--mono); font-size:13px; letter-spacing:.12em; color:var(--accent); display:flex; align-items:center; gap:10px}
.step .n::after{content:""; flex:1; height:1px; background:var(--line); transform-origin:left; transform:scaleX(0); transition:transform 1s var(--ease) .3s}
.step.in .n::after{transform:scaleX(1)}
.step h4{margin:14px 0 6px; font-size:16px; font-weight:600}
.step p{margin:0; color:var(--ink-2); font-size:14.5px}
.step code{font-family:var(--mono); font-size:12.5px; background:var(--surface-2); padding:1px 5px; border-radius:3px}

/* ---------- CONTACT ---------- */
.contact{display:grid; grid-template-columns:1fr 1.1fr; gap:48px; align-items:start}
.contact p.lead{margin-bottom:0}
.cards-c{display:flex; gap:28px; justify-content:flex-start; align-items:center; padding-top:8px}
.social{position:relative; width:84px; height:84px; border-radius:50%; display:grid; place-items:center; text-decoration:none;
  background:var(--surface); border:1px solid var(--line-2); transition:transform .35s var(--ease), border-color .3s, background .3s}
.social svg,.social img{width:36px; height:36px; transition:transform .35s var(--ease)}
.social img{border-radius:8px; object-fit:contain}
.social::before{content:""; position:absolute; inset:-1px; border-radius:50%; border:1px solid currentColor; opacity:0; color:var(--brand)}
.social:hover{transform:translateY(-4px); border-color:var(--brand); background:color-mix(in srgb,var(--brand) 10%,var(--surface))}
.social:hover svg,.social:hover img{transform:scale(1.1) rotate(-6deg)}
.social:hover::before{animation:ring 1.1s var(--ease) infinite}
@keyframes ring{0%{opacity:.6; transform:scale(1)} 100%{opacity:0; transform:scale(1.45)}}
.social .lbl{position:absolute; top:calc(100% + 10px); left:50%; translate:-50% -4px; opacity:0; transition:.25s; white-space:nowrap; color:var(--muted)}
.social:hover .lbl,.social:focus-visible .lbl{opacity:1; translate:-50% 0}
.s-zalo{--brand:#0068ff; color:#fff; background:#0068ff; border-color:#0068ff}
.s-mail{--brand:var(--accent); color:var(--on-accent); background:var(--accent); border-color:var(--accent)}
.social.has-img{background:#fff; border-color:#e3e8f0}
.social.has-img img{width:46px; height:46px; border-radius:10px}
.s-zalo:hover,.s-mail:hover{background:var(--brand); filter:brightness(1.08)}
.social .lbl{color:var(--muted)}
.social::before{color:var(--brand)}

footer{border-top:1px solid var(--line); padding:26px 0 40px; color:var(--muted); font-size:13px}
footer .wrap{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap}
footer a{color:var(--ink-2)}

.toast{position:fixed; left:50%; bottom:24px; translate:-50% 20px; opacity:0; background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:var(--r); font-size:13.5px; transition:.25s; pointer-events:none; z-index:50}
.toast.show{opacity:1; translate:-50% 0}

/* ---------- MOTION ---------- */
.fx{opacity:0; transform:translateY(22px); transition:opacity .8s var(--ease), transform .8s var(--ease); transition-delay:var(--d,0s)}
.fx.in{opacity:1; transform:none}
.hero .fx{animation:fadeUp .9s var(--ease) forwards; animation-delay:var(--d,0s); transition:none}
@keyframes fadeUp{to{opacity:1; transform:none}}
.drawing .draw{stroke-dasharray:1; stroke-dashoffset:1; animation:draw 1.6s var(--ease) forwards; animation-delay:var(--d,0s)}
@keyframes draw{to{stroke-dashoffset:0}}
.drawing text{opacity:0; animation:fadeIn .6s ease forwards 2.2s}
.drawing .dot{transform-origin:210px 57px; animation:pulse 2.4s ease-in-out infinite 2.4s; opacity:0}
@keyframes fadeIn{to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.5; transform:scale(1.8)}}
.drawing-wrap{animation:float 7s ease-in-out infinite 2.5s}
@keyframes float{0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)}}
.card{opacity:0; transform:translateY(26px); transition:opacity .7s var(--ease), transform .7s var(--ease), border-color .2s; transition-delay:var(--d,0s)}
.card.in{opacity:1; transform:none}
.card.in:hover{transform:translateY(-4px); transition-delay:0s}
.card .icon{transition:transform .4s var(--ease)}
.card:hover .icon{transform:rotate(-6deg) scale(1.06)}
.card::before,.card::after{transition:width .35s var(--ease), height .35s var(--ease)}
.card:hover::before,.card:hover::after{width:22px; height:22px}
.btn.primary{position:relative; overflow:hidden}
.btn.primary::after{content:""; position:absolute; inset:0; background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%); transform:translateX(-120%); transition:transform .7s var(--ease)}
.btn.primary:hover::after{transform:translateX(120%)}
.btn.primary:hover svg{animation:nudge .6s var(--ease)}
@keyframes nudge{50%{transform:translateY(2px)}}
#themeBtn svg{transition:transform .5s var(--ease)}
#themeBtn:hover svg{transform:rotate(40deg)}
.progress{position:fixed; top:0; left:0; height:2px; background:var(--accent); width:100%; transform-origin:left; transform:scaleX(0); z-index:30}

@media (max-width:900px){
  .hero .wrap,.contact{grid-template-columns:1fr}
  .drawing-wrap{order:-1; max-width:420px}
  .steps{grid-template-columns:1fr}
  .step + .step{border-left:0; border-top:1px solid var(--line)}
  .links{display:none}
  .ctrls{margin-left:auto}
}
@media (max-width:520px){
  .wrap{padding:0 18px}
  .grid{grid-template-columns:1fr}
  .search input{width:100%}
  .search{flex:1 1 100%}
  .specs{grid-template-columns:repeat(2,1fr)}
  .specs div:nth-child(3){padding-left:0; border-left:0; border-top:1px solid var(--line)}
  .specs div:nth-child(4){border-top:1px solid var(--line)}
  .dim b{font-size:30px}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important; animation:none!important; scroll-behavior:auto!important}
  .fx,.card,.drawing text,.drawing .dot{opacity:1!important; transform:none!important}
  .drawing .draw{stroke-dashoffset:0!important}
  h1 .line > span,h1 em::after{transform:none!important}
}

/* ---------- TRANG CHI TIẾT ---------- */
main.detail{padding:36px 0 80px}
.back{display:inline-block;margin-bottom:22px;color:var(--muted);text-decoration:none;font-size:14px;transition:color .2s,transform .2s}
.back:hover{color:var(--accent);transform:translateX(-3px)}
.dhead{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;animation:fadeup .6s var(--ease) both}
.icon.big{width:104px;height:104px;border-radius:22px;flex:none;font-size:30px}
.icon.big img{width:68%;height:68%}
.dtitle{flex:1;min-width:260px}
.dtitle h1{font-size:clamp(32px,4.4vw,52px);margin:6px 0 10px;text-transform:none}
.dtitle .lead{max-width:680px;margin:0 0 18px}
.tagline{color:var(--accent)}
.pricebox{display:inline-flex;align-items:baseline;gap:12px;padding:9px 16px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);margin-bottom:16px}
.pricebox b{font-size:22px;font-weight:600}.pricebox span{color:var(--muted);font-size:13px}
.pricebox.paid b{color:var(--accent)}
.dcols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:34px;margin-top:34px;align-items:start}
.dsec{margin-bottom:34px;animation:fadeup .6s var(--ease) both}
.dsec h2{font-size:24px;margin:0 0 14px;text-transform:none}
.vwrap{position:relative;aspect-ratio:16/9;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#000}
.vwrap iframe,.vwrap video{position:absolute;inset:0;width:100%;height:100%;border:0}
.vwrap .vlink{position:absolute;inset:0;display:grid;place-items:center;background:var(--surface-2)}
.feat{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.feat li{padding:10px 14px 10px 38px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);position:relative;transition:transform .2s,border-color .2s}
.feat li:hover{transform:translateX(3px);border-color:var(--accent)}
.feat li::before{content:"";position:absolute;left:15px;top:50%;width:7px;height:7px;margin-top:-4px;background:var(--accent);transform:rotate(45deg)}
.steps{margin:0;padding-left:22px}.steps li{margin:8px 0;color:var(--ink-2)}
.steps code{background:var(--surface-2);padding:1px 6px;border-radius:4px;font-size:13px}
.rel{border-left:2px solid var(--line-2);padding:2px 0 2px 16px;margin-bottom:16px}
.rel-top{color:var(--muted);margin-bottom:4px}.notes ul{margin:4px 0;padding-left:20px}.notes h4{margin:6px 0 2px}
.spec{padding:18px;position:sticky;top:84px}
.spec h3{margin:0 0 12px;font-size:17px;text-transform:none}
.spec dl{margin:0}.spec dl>div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.spec dt{color:var(--muted)}.spec dd{margin:0;font-weight:500;text-align:right}
.empty-d{text-align:center;padding:90px 0}
.muted{color:var(--muted)}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(max-width:860px){.dcols{grid-template-columns:1fr}.spec{position:static}}
</style>

<script>
const CONFIG = { owner:"doanphutien00-afk", repo:"doanphutien00-afk.github.io" };
const I18N = {
  vi:{ nav_plugins:"Plugin", nav_install:"Cài đặt", nav_contact:"Liên hệ", nav_buy:"Mua bản quyền", nav_stats:"Thống kê", nav_fb:"Góp ý",
    back:"← Tất cả plugin", free:"Miễn phí", lifetime:"vĩnh viễn · dùng trên 2 máy · dùng thử 3 ngày", buy:"Mua bản quyền", get_hub:"Tải PT Hub", with_hub:"Cài bằng PT Hub",
    watch:"Xem video", demo:"Video demo & hướng dẫn", features:"Tính năng nổi bật", about:"Giới thiệu", info:"Thông tin", version:"Phiên bản", updated:"Cập nhật", size:"Dung lượng", downloads:"Lượt tải",
    cat:"Nhóm", compat:"SketchUp", price:"Giá", license:"Hình thức", paid_l:"Bản quyền vĩnh viễn", free_l:"Miễn phí",
    install:"Cách cài đặt", i1:"Tải và cài <b>PT Hub</b> (1 lần): <code>Extensions → Extension Manager → Install Extension</code>.", i2:"Mở <b>PT Hub</b> → tab <b>Plugin</b> → bấm <b>Cài đặt</b> ở <b>{n}</b>.",
    i3_paid:"Đăng nhập tài khoản đã mua trong PT Hub và bấm <b>Kích hoạt</b> (hoặc <b>Dùng thử 3 ngày</b>).", i3_free:"Khởi động lại SketchUp – plugin hiện trong menu Extensions và thanh công cụ.", i4:"Có bản mới, PT Hub báo ở tab <b>Cập nhật</b> – bấm 1 lần là xong.",
    changelog:"Lịch sử thay đổi", no_notes:"Không có ghi chú.", notfound:"Không tìm thấy plugin này.", all:"Xem tất cả plugin", cats:{"Kiến trúc":"Kiến trúc","Nội thất":"Nội thất","Tiện ích":"Tiện ích","Khác":"Khác"}, loading:"Đang tải…" },
  en:{ nav_plugins:"Plugins", nav_install:"Install", nav_contact:"Contact", nav_buy:"Buy license", nav_stats:"Statistics", nav_fb:"Feedback",
    back:"← All plugins", free:"Free", lifetime:"lifetime · 2 PCs · 3-day trial", buy:"Buy license", get_hub:"Get PT Hub", with_hub:"Install with PT Hub",
    watch:"Watch video", demo:"Demo & tutorial video", features:"Highlights", about:"About", info:"Details", version:"Version", updated:"Updated", size:"Size", downloads:"Downloads",
    cat:"Category", compat:"SketchUp", price:"Price", license:"Licence", paid_l:"Lifetime license", free_l:"Free",
    install:"How to install", i1:"Download and install <b>PT Hub</b> once: <code>Extensions → Extension Manager → Install Extension</code>.", i2:"Open <b>PT Hub</b> → <b>Plugins</b> tab → click <b>Install</b> on <b>{n}</b>.",
    i3_paid:"Sign in with the account you bought with in PT Hub and press <b>Activate</b> (or <b>Start 3-day trial</b>).", i3_free:"Restart SketchUp – the plugin appears in Extensions and the toolbar.", i4:"New versions show in the <b>Updates</b> tab – one click installs them.",
    changelog:"Changelog", no_notes:"No notes.", notfound:"Plugin not found.", all:"Browse all plugins", cats:{"Kiến trúc":"Architecture","Nội thất":"Interior","Tiện ích":"Utilities","Khác":"Other"}, loading:"Loading…" }
};
const TAG_RE=/^(.+)-v(\d+(?:\.\d+)*)$/;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cmpVer=(a,b)=>{const pa=a.split(".").map(Number),pb=b.split(".").map(Number);for(let i=0;i<Math.max(pa.length,pb.length);i++){const d=(pa[i]||0)-(pb[i]||0);if(d)return d}return 0};
const state={lang:document.documentElement.lang==="en"?"en":"vi",p:null,site:{}};
const T=k=>I18N[state.lang][k];
const fmtNum=n=>Number(n||0).toLocaleString(state.lang==="en"?"en-US":"vi-VN");
const fmtDate=d=>d?new Date(d).toLocaleDateString(state.lang==="en"?"en-GB":"vi-VN",{day:"2-digit",month:"2-digit",year:"numeric"}):"–";
const fmtSize=b=>!b?"–":b>=1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB";
const pick=(p,k)=>state.lang==="en"&&p[k+"_en"]?p[k+"_en"]:p[k];
function md(text){
  const lines=esc(text).split(/\r?\n/);let out="",inList=false;
  const inl=s=>s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>");
  for(const l of lines){const li=l.match(/^\s*[-*]\s+(.*)/);
    if(li){if(!inList){out+="<ul>";inList=true}out+=`<li>${inl(li[1])}</li>`;continue}
    if(inList){out+="</ul>";inList=false}
    const h=l.match(/^#{1,6}\s+(.*)/); if(h)out+=`<h4>${inl(h[1])}</h4>`; else if(l.trim())out+=`<div>${inl(l)}</div>`;}
  return out+(inList?"</ul>":"");
}
function embed(u){
  if(!u) return "";
  if(!/^https?:/.test(u)) return `<video controls preload="metadata" playsinline src="${esc(u)}"></video>`;
  let m;
  if((m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/))([\w-]{11})/))) return `<iframe src="https://www.youtube.com/embed/${m[1]}" allowfullscreen loading="lazy" allow="accelerometer; encrypted-media; picture-in-picture"></iframe>`;
  if((m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/))) return `<iframe src="https://drive.google.com/file/d/${m[1]}/preview" allowfullscreen loading="lazy"></iframe>`;
  return `<div class="vlink"><a class="btn primary" href="${esc(u)}" target="_blank" rel="noopener"><svg><use href="#i-arrow"/></svg>${T("watch")}</a></div>`;
}
function applyI18n(){
  document.documentElement.lang=state.lang;
  document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=T(e.dataset.i18n));
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===state.lang));
  render(); window.ptAuthRender?.();
}
function render(){
  const root=$("#root"), p=state.p;
  if(!p){ root.innerHTML=state.loaded?`<div class="empty-d"><p>${T("notfound")}</p><a class="btn primary" href="./#plugins">${T("all")}</a></div>`:`<div class="empty-d">${T("loading")}</div>`; return; }
  const name=pick(p,"name"), L=p.latest, paid=p.type==="paid", price=Number(p.price)||0, hub=p.id==="pt_hub";
  document.title=name+" — PT Plugins";
  const ini=name.split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
  const feats=(p.features||[]), desc=pick(p,"description")||"";
  const compat=p.min_su?`${p.min_su}${p.max_su?" – "+p.max_su:"+"}`:"–";
  const rows=[[T("version"),L?"v"+esc(L.version):"–"],[T("updated"),fmtDate(L&&L.date)],[T("size"),fmtSize(L&&L.size)],[T("downloads"),fmtNum(p.downloads)],
    [T("cat"),esc(I18N[state.lang].cats[p.category]||p.category||"–")],[T("compat"),esc(compat)],[T("license"),paid?T("paid_l"):T("free_l")],...(paid?[[T("price"),price.toLocaleString("vi-VN")+"đ"]]:[])];
  const hubUrl=state.hubUrl||"";
  root.innerHTML=`<a class="back" href="./#plugins">${T("back")}</a>
  <header class="dhead"><div class="icon big">${p.icon?`<img src="${esc(p.icon)}" alt="">`:esc(ini)}</div>
    <div class="dtitle"><div class="mono tagline">${esc(I18N[state.lang].cats[p.category]||p.category||"")}</div><h1>${esc(name)}</h1><p class="lead">${esc(desc)}</p>
      <div class="pricebox ${paid?"paid":"free"}">${paid?`<b>${price.toLocaleString("vi-VN")}đ</b><span>${T("lifetime")}</span>`:`<b>${T("free")}</b>`}</div>
      <div class="cta">${paid?`<a class="btn primary" href="mua.html?p=${encodeURIComponent(p.id)}"><svg><use href="#i-arrow"/></svg>${T("buy")}</a>`:""}
        ${hub?`<a class="btn primary" href="${esc(L&&L.url||"#")}" aria-disabled="${!(L&&L.url)}"><svg><use href="#i-dl"/></svg>${T("get_hub")}</a>`:`<a class="btn ${paid?"ghost":"primary"}" href="#install"><svg><use href="#i-dl"/></svg>${T("with_hub")}</a>`}</div></div></header>
  ${p.video?`<section class="dsec"><h2>${T("demo")}</h2><div class="vwrap">${embed(p.video)}</div></section>`:""}
  <div class="dcols"><div>
    ${feats.length?`<section class="dsec"><h2>${T("features")}</h2><ul class="feat">${feats.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></section>`:""}
    <section class="dsec" id="install"><h2>${T("install")}</h2><ol class="steps">
      <li>${hub?T("i1"):T("i1")+` <a href="${esc(hubUrl||"./#install")}">${T("get_hub")}</a>`}</li>
      ${hub?"":`<li>${T("i2").replace("{n}",esc(name))}</li><li>${paid?T("i3_paid"):T("i3_free")}</li>`}<li>${T("i4")}</li></ol></section>
    <section class="dsec"><h2>${T("changelog")}</h2>${p.versions.length?p.versions.map(v=>`<div class="rel"><div class="rel-top mono"><b>v${esc(v.version)}</b> · ${fmtDate(v.date)}</div><div class="notes">${md(v.notes)||`<i>${T("no_notes")}</i>`}</div></div>`).join(""):`<p class="muted">${T("no_notes")}</p>`}</section>
  </div>
  <aside><div class="card spec"><h3>${T("info")}</h3><dl>${rows.map(r=>`<div><dt class="mono">${r[0]}</dt><dd>${r[1]}</dd></div>`).join("")}</dl></div></aside></div>`;
}
async function load(){
  const id=new URLSearchParams(location.search).get("p")||"";
  let manifest={site:{},plugins:[]}, cat={plugins:[]}, releases=[];
  try{manifest=await (await fetch("plugins.json",{cache:"no-cache"})).json()}catch(e){}
  try{cat=await (await fetch("pt-hub/PT_Hub_phien_ban.json",{cache:"no-cache"})).json()}catch(e){}
  try{const r=await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/releases?per_page=100`); if(r.ok)releases=await r.json()}catch(e){}
  const byId={};
  for(const r of releases){ if(r.draft||r.prerelease)continue; const m=(r.tag_name||"").match(TAG_RE); if(!m)continue;
    const a=(r.assets||[]).find(a=>/\.rbz$/i.test(a.name));
    (byId[m[1]]||=[]).push({version:m[2],date:r.published_at,notes:r.body||"",url:a?`/pt-hub/goi/${encodeURIComponent(r.tag_name)}/${encodeURIComponent(a.name)}`:"",size:a?.size,downloads:(r.assets||[]).reduce((s,x)=>s+(x.download_count||0),0)}); }
  const base=(manifest.plugins||[]).find(x=>x.id===id&&!x.hidden);
  const c=(cat.plugins||[]).find(x=>x.id===id)||{};
  const hubSite=(manifest.plugins||[]).find(x=>x.id==="pt_hub"), hubRel=(byId.pt_hub||[]).sort((a,b)=>cmpVer(b.version,a.version))[0];
  state.hubUrl=hubRel&&hubRel.url||(hubSite&&hubSite.download)||"";
  if(base){
    const all=(byId[id]||[]).sort((a,b)=>cmpVer(b.version,a.version));
    if(base.download&&base.version&&!all.some(x=>x.version===base.version)) all.unshift({version:base.version,date:base.date||null,notes:base.notes||"",url:base.download,size:base.size||0,downloads:0});
    const v=base.version?all.filter(x=>cmpVer(x.version,base.version)<=0):all;
    if(base.version){const cur=v.find(x=>x.version===base.version);if(cur&&base.date)cur.date=base.date;if(cur&&base.notes)cur.notes=base.notes;}
    state.p={...base,type:base.type||c.type,price:base.price??c.price,min_su:c.min_sketchup_version,max_su:c.max_sketchup_version,versions:v,latest:v[0],downloads:all.reduce((s,x)=>s+x.downloads,0)};
  }
  state.loaded=true; applyI18n();
}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{state.lang=b.dataset.lang;try{localStorage.setItem("pt-lang",state.lang)}catch(e){}applyI18n()}));
$("#themeBtn")?.addEventListener("click",()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==="dark"?"light":"dark";try{localStorage.setItem("pt-theme",r.dataset.theme)}catch(e){}});
applyI18n(); load();
</script>
